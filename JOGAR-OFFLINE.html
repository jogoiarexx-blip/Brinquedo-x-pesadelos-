.level-night{background:linear-gradient(135deg,#8c9ec6,#51648f);border-color:#c4d8f9;color:#172945}

.game-frame{border-color:#e6c7a7;box-shadow:0 8px 0 #60425f,0 28px 70px #100b20b8,0 0 0 2px #f7dfc5,0 0 0 5px #4b3555}

.glow-pill{box-shadow:inset 0 4px 0 #fff6ca28,inset 0 -5px 10px #20162b55,0 5px 0 #36283b,0 0 16px #ffdf8a30}

.upgrade-card{display:flex;flex-direction:column;min-width:0;padding:16px;background:linear-gradient(145deg,#8f72935c,#211b3e80);border:1px solid #c5a2bc70;border-radius:18px;box-shadow:inset 0 1px 0 #fff2}
.upgrade-card.locked{background:#2c234350;border-style:dashed}.upgrade-card.locked .upgrade-art{filter:grayscale(.85);opacity:.55}.upgrade-card.maxed{border-color:#efcd7c}
.upgrade-card-head{display:flex;gap:10px;align-items:center}.upgrade-art{width:62px;height:68px;flex-shrink:0;filter:drop-shadow(0 4px 3px #21173288)}
.upgrade-level{color:#f7d98e;font-size:10px;font-weight:900;letter-spacing:.12em}.upgrade-card h2{font-size:15px;line-height:1.25;margin:4px 0 8px;color:#fff0d5}
.upgrade-pips{display:flex;gap:5px}.upgrade-pips i{width:19px;height:5px;border-radius:4px;background:#30263e;border:1px solid #a2869a}.upgrade-pips i.filled{background:#f6d17e;border-color:#ffe9a7}
.upgrade-card .upgrade-role{font-size:11px;line-height:1.5;min-height:34px;color:#dfcddd;margin:11px 0 8px}
.upgrade-stats{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px;margin-bottom:8px}.upgrade-stats th,.upgrade-stats td{padding:6px 2px;border-bottom:1px solid #e2cfdf19;text-align:right}.upgrade-stats th:first-child{text-align:left}.upgrade-stats thead th{font-size:9px;color:#bdabc6;text-transform:uppercase;letter-spacing:.05em}.upgrade-stats tbody th{font-weight:400;color:#ead8e5}.upgrade-stats td:last-child{color:#bde9cc;font-weight:900}
.upgrade-card .upgrade-detail{font-size:10px;line-height:1.4;color:#dcc6d8;margin:auto 0 10px;padding-top:6px}
.upgrade-btn{width:100%;min-height:40px;border-radius:10px;border:2px solid #ffdc93;background:linear-gradient(#ffe5a5,#efba77);color:#3c2e4c;font-weight:900;font-size:13px;box-shadow:0 3px 0 #30253d}
.upgrade-btn:enabled:hover{filter:brightness(1.1)}.upgrade-btn:disabled{background:#77617d55;color:#d5c0d1;border-color:#c5a4bb60;cursor:not-allowed;box-shadow:none}
.workshop-footer{display:flex;gap:15px;align-items:center;margin-top:20px;border-top:1px solid #efc8d633;padding-top:12px}.workshop-footer p{flex:1;font-size:11px;line-height:1.5;color:#e1c7d7}.workshop-footer button{flex-shrink:0;min-height:42px}.workshop-footer button:disabled{opacity:.5;cursor:not-allowed}
.map-workshop{display:flex;align-items:center;justify-content:space-between;gap:10px}.map-workshop .tiny-btn{flex-shrink:0}.star-reward{background:#f6d4821c;border:1px solid #f3cf8655;border-radius:14px;padding:12px;color:#ffe39a;font-size:18px;font-weight:900;margin:12px 0}.star-reward small{font-size:12px;font-weight:400;color:#f4dcc0}
.menu-actions{gap:clamp(5px,1vw,12px)}
@media(max-width:1000px){.workshop-panel{padding:16px}.upgrade-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.upgrade-card{padding:12px}.workshop-summary{padding:12px;gap:12px}.workshop-summary p{font-size:15px}.workshop-footer{flex-wrap:wrap}.workshop-footer p{flex-basis:100%;margin:0}}
@media(max-width:600px){.upgrade-grid{grid-template-columns:1fr}.workshop-summary{flex-wrap:wrap}.workshop-summary p{flex-basis:50%}.wallet-history{width:100%;text-align:left;font-size:11px}.wallet-history br{display:none}.wallet-history strong:last-of-type{margin-left:15px}.workshop-panel .workshop-help{font-size:11px}.workshop-panel h1{font-size:20px}.workshop-panel .subheading{font-size:9px}.upgrade-card .upgrade-role{min-height:0}}
@media(orientation:portrait) and (max-width:900px){.screen:has(.workshop-panel){padding:8px;align-items:flex-start}.game-frame:has(.workshop-panel){height:min(88dvh,760px);aspect-ratio:auto}.workshop-panel{max-height:100%;padding:14px}.workshop-panel .panel-head .tiny-btn{min-height:40px}.workshop-footer p{font-size:11px}}

const UPGRADE_COSTS = Object.freeze([2,4,6]);
function upgradeRank(value) {
  return Number.isInteger(value)&&value>=0&&value<=UPGRADE_COSTS.length?value:0;
}
function upgradeSpent(value) {
  return UPGRADE_COSTS.slice(0,upgradeRank(value)).reduce((sum,cost)=>sum+cost,0);
}
function upgradedToy(id,rank=0) {
  const base=TOYS[id];if(!base)return null;
  rank=upgradeRank(rank);
  const data={...base,rank,maxHp:Math.round(base.maxHp*(1+.15*rank))};
  const precision=value=>Math.round(value*1000)/1000;
  if(base.damage)data.damage=precision(base.damage*(1+.1*rank));
  if(base.kind==='producer')data.interval=precision(base.interval*(1-.05*rank));
  if(base.slowDuration)data.slowDuration=precision(base.slowDuration*(1+.1*rank));
  if(base.stunDuration)data.stunDuration=precision(base.stunDuration*(1+.1*rank));
  return data;
}




const defaults = () => ({ version:1, campaignSize:LEVELS.length, unlocked:1, stars:{}, upgrades:{}, seenEnemies:[], settings:{ music:true, sfx:true, motion:true } });
const starScore=value=>['number','string'].includes(typeof value)&&Number.isFinite(Number(value))?Math.max(0,Math.min(3,Math.floor(Number(value)))):0;
function unlockedToys(save) {
  return new Set(LEVELS.slice(0,save.unlocked).flatMap(level=>level.toys));
}
function starWallet(save) {
  const earned=LEVELS.reduce((sum,level)=>sum+starScore(save.stars?.[level.id]),0);
  const spent=Object.keys(TOYS).reduce((sum,id)=>sum+upgradeSpent(save.upgrades?.[id]),0);
  return {earned,spent,available:Math.max(0,earned-spent)};
}
function normalizeSave(raw) {
  const save=defaults();
  if(!raw||raw.version!==1)return save;
  const unlocked=Number(raw.unlocked);
  save.unlocked=Number.isFinite(unlocked)?Math.max(1,Math.min(LEVELS.length,Math.floor(unlocked))):1;
  for(const level of LEVELS){const score=starScore(raw.stars?.[level.id]);if(score)save.stars[level.id]=score;}
  // Saves até v1.2 não tinham campaignSize; a campanha terminava na 3-4.
  const previousCap=Number.isInteger(raw.campaignSize)?raw.campaignSize:20;
  if(previousCap>0&&previousCap<LEVELS.length&&save.unlocked===previousCap&&save.stars[LEVELS[previousCap-1].id])save.unlocked++;
  save.seenEnemies=Array.isArray(raw.seenEnemies)?[...new Set(raw.seenEnemies.filter(id=>Object.hasOwn(ENEMIES,id)))]:[];
  for(const key of Object.keys(save.settings))if(typeof raw.settings?.[key]==='boolean')save.settings[key]=raw.settings[key];
  let budget=starWallet(save).earned;
  const unlockedIds=unlockedToys(save);
  for(const id of Object.keys(TOYS)){
    const rank=upgradeRank(raw.upgrades?.[id]),cost=upgradeSpent(rank);
    if(rank&&unlockedIds.has(id)&&cost<=budget){save.upgrades[id]=rank;budget-=cost;}
  }
  return save;
}
function loadSave(storage=null) {
  try {
    storage ||= globalThis.localStorage;
    return normalizeSave(JSON.parse(storage.getItem(SAVE_KEY)));
  } catch { return defaults(); }
}
function persistSave(save,storage=null) {
  try {
    storage ||= globalThis.localStorage; storage.setItem(SAVE_KEY,JSON.stringify(save)); return true; }
  catch { return false; }
}
function recordVictory(save,levelIndex,stars) {
  if(!Number.isInteger(levelIndex)||!LEVELS[levelIndex]||!Number.isInteger(stars)||stars<1||stars>3)return save;
  save.unlocked = Math.max(save.unlocked,Math.min(LEVELS.length,levelIndex+2));
  const id=LEVELS[levelIndex]?.id;
  save.stars[id]=Math.max(starScore(save.stars[id]),stars);
  return save;
}
function purchaseUpgrade(save,id,storage=null) {
  if(!Object.hasOwn(TOYS,id))return {ok:false,reason:'unknown'};
  if(!unlockedToys(save).has(id))return {ok:false,reason:'locked'};
  const rank=upgradeRank(save.upgrades?.[id]);
  if(rank>=UPGRADE_COSTS.length)return {ok:false,reason:'max'};
  if(starWallet(save).available<UPGRADE_COSTS[rank])return {ok:false,reason:'stars'};
  const upgrades={...save.upgrades,[id]:rank+1};
  if(!persistSave({...save,upgrades},storage))return {ok:false,reason:'storage'};
  save.upgrades=upgrades;return {ok:true};
}
function resetUpgrades(save,storage=null) {
  if(!persistSave({...save,upgrades:{}},storage))return false;
  save.upgrades={};return true;
}

class AudioService {
  constructor() { this.ctx=null; this.sfx=true; this.music=true; this.musicTimer=0; this.musicStep=0; this.lastShoot=-99; this.disabled=false; }
  resume() { if(this.disabled)return; try { const Context=window.AudioContext||window.webkitAudioContext; if(!Context)return; this.ctx ||=new Context(); if(this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); } catch {this.disabled=true;} }
  tone(freq, duration=.09, type='sine', vol=.045, at=0) {
    if (!this.ctx || this.ctx.state!=='running')return;
    const t=this.ctx.currentTime+at;
    try { const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+duration+.02); }catch{}
  }
  play(type) {
    if (!this.sfx)return;
    switch(type){
      case 'cuckoo':this.tone(690,.15,'triangle',.025);this.tone(540,.18,'triangle',.025,.17);break;
      case 'sneeze-warn':this.tone(180,.23,'sine',.03);this.tone(240,.2,'sine',.035,.28);break;
      case 'sneeze':this.tone(120,.22,'sawtooth',.025);this.tone(210,.18,'triangle',.035,.12);break;
      case 'door':this.tone(205,.23,'triangle',.06);this.tone(175,.26,'sine',.04,.1);break;
      case 'steal':this.tone(650,.09,'triangle',.036);this.tone(340,.17,'sine',.045,.09);break;
      case 'click':this.tone(560,.065,'sine',.029);break;
      case 'place':this.tone(470,.09,'triangle',.06);this.tone(730,.11,'sine',.04,.065);break;
      case 'collect':this.tone(860,.085,'sine',.055);this.tone(1175,.14,'sine',.05,.07);break;
      case 'shoot':this.tone(350,.055,'triangle',.013);break;
      case 'freeze':this.tone(720,.11,'sine',.022);this.tone(990,.12,'sine',.014,.05);break;
      case 'confetti':this.tone(440,.085,'triangle',.026);this.tone(680,.09,'triangle',.02,.04);break;
      case 'sleep':this.tone(580,.2,'sine',.023);this.tone(400,.23,'sine',.022,.08);break;
      case 'jump':this.tone(300,.12,'triangle',.025);this.tone(590,.16,'sine',.03,.07);break;
      case 'hit':this.tone(195,.085,'triangle',.028);break;
      case 'remove':this.tone(220,.14,'sine',.045);break;
      case 'no':this.tone(170,.16,'sawtooth',.03);break;
      case 'enemy':this.tone(245,.07,'triangle',.022);break;
      case 'wave':this.tone(390,.22,'square',.038);this.tone(310,.24,'square',.035,.24);break;
      case 'victory': [523,659,784,1047].forEach((f,i)=>this.tone(f,.26,'triangle',.065,i*.14));break;
      case 'defeat':[350,310,220].forEach((f,i)=>this.tone(f,.25,'triangle',.046,i*.22));break;
    }
  }
  tick(dt,playing=true) {
    if(!playing || !this.music || !this.ctx || this.ctx.state!=='running')return;
    this.musicTimer+=dt;
    if(this.musicTimer>.41){this.musicTimer%=.41;
      // Pequena melodia composta para este jogo; não reproduz trilha de terceiros.
      const notes=[392,0,523,0,587,523,440,0,392,0,349,0,330,349,392,0];
      const f=notes[this.musicStep++%notes.length]; if(f)this.tone(f,.21,'sine',.012);
    }
  }
}




class Battle {

  rand(){let x=this.seed|0;x^=x<<13;x^=x>>>17;x^=x<<5;this.seed=x|0;return (x>>>0)/4294967296;}
  visualRand(){let x=this.visualSeed|0;x^=x<<13;x^=x>>>17;x^=x<<5;this.visualSeed=x|0;return (x>>>0)/4294967296;}
  startToast(text,seconds=2.3){this.lastAction=text;this.toastUntil=this.time+seconds;this.events.toast?.(text,seconds);}
  selectToy(id){if(!this.level.toys.includes(id))return false;this.selected=id;this.shovel=false;this.audio.play('click');return true;}
  selectShovel(){this.shovel=!this.shovel;this.audio.play('click');}
  canPlace(row,col,id=this.selected){

    if(this.grid[row][col])return 'Esta casa já está ocupada';
    if(!this.level.toys.includes(id))return 'Brinquedo bloqueado';

  }
  place(row,col,id=this.selected){

    const data=this.toyStats[id];
    const toy={id:this.id++,type:id,row,col,x:colX(col),y:rowY(row),hp:data.maxHp,maxHp:data.maxHp,
      rank:data.rank,timer:data.kind==='producer'?7.5:data.kind==='music'?3.2:data.kind==='clock'?3:.33+this.rand()*.6,hit:0,age:0,recoil:0,webTime:0,armed:false};

  remove(row,col){

  click(x,y){

  spawnStar(x,y,fromSky=true){

  updateDustBoss(enemy,dt){
    // O aviso e o descanso são estados de combate, inclusive sem partículas.
    if(enemy.x>BOARD_RIGHT+10)return false;
    enemy.phaseTimer-=dt;
    if(enemy.bossPhase==='march'){
      if(enemy.phaseTimer>0)return false;
      enemy.bossPhase='warning';enemy.phaseTimer=1.2;
      this.flashBanner(enemy.nextAttack==='gust'?`VOVÔ VAI ESPIRRAR • FAIXA ${enemy.row+1}!`:'VOVÔ VAI CHAMAR MINI-POEIRAS!',1.2);

  get progress(){return clamp(this.time/this.level.duration,0,1);}

    for(let i=this.enemies.length-1;i>=0;i--){
      const e=this.enemies[i],d=ENEMIES[e.type];e.age+=dt;e.hit=Math.max(0,e.hit-dt);e.attack=Math.max(0,(e.attack||0)-dt);e.jumpTime=Math.max(0,(e.jumpTime||0)-dt);e.slowTime=Math.max(0,e.slowTime-dt);if(e.slowTime===0)e.slowFactor=1;
      if(d.enrage&&!e.enraged&&e.hp<=e.maxHp*.5){e.enraged=true;this.addImpact(e.x,e.y-25,'jump');this.audio.play('wave');}
      if(d.summon){
        const threshold=[.65,.30];
        if(e.summons<threshold.length&&e.hp<=e.maxHp*threshold[e.summons]){
          e.summons++;const lanes=e.summons===1?[0,4]:[1,3];
          for(const lane of lanes)this.spawnEnemy(e.summons===1?'E08':'E09',lane,0);
          this.flashBanner('A DAMA CHAMOU MAIS PESADELOS!',3);this.audio.play('wave');
        }
      }
      if(d.thief){
        e.stealTimer=Math.max(0,(e.stealTimer||0)-dt);
        if(e.stealTimer<=0){
          const i=this.stars.findIndex(s=>s.age>=s.dropTime&&Math.abs(s.x-e.x)<72&&Math.abs(s.y-e.y)<58);
          if(i>=0){const stolen=this.stars.splice(i,1)[0];e.stealTimer=7.5;
            this.puff(stolen.x,stolen.y,'#c5a4ed',8);this.addFeedback(e.x,e.y-69,'ROUBOU ✦','#ffcae6');this.audio.play('steal');}
        }
      }
      if(d.web){
        e.webTimer-=dt;
        if(e.webTimer<=0){
          const nearby=this.grid[e.row].find(toy=>toy&&toy.x<e.x&&e.x-toy.x<BOARD.cw*3);
          if(nearby){nearby.webTime=Math.max(nearby.webTime||0,4.1);e.webTimer=8.5;this.addImpact(nearby.x,nearby.y-20,'slow');this.audio.play('hit');}
          else e.webTimer=.4;
        }
      }
      const wasAsleep=e.stunTime>0;e.stunTime=Math.max(0,(e.stunTime||0)-dt);if(wasAsleep)continue;
      if(d.dustBoss&&this.updateDustBoss(e,dt))continue;
      if(d.jump&&!e.jumped){
        const hurdle=this.grid[e.row].filter(t=>t&&e.x>t.x+39&&e.x<t.x+87).sort((a,b)=>b.x-a.x)[0];
        if(hurdle){e.x=hurdle.x-53;e.jumped=true;e.jumpTime=.48;this.addImpact(e.x,e.y-20,'jump');this.audio.play('jump');}
      }
      const blockers=this.grid[e.row].filter(t=>t && e.x<=t.x+39 && e.x>=t.x-41).sort((a,b)=>b.x-a.x);
      if(blockers.length){
        const toy=blockers[0];e.attackTimer-=dt;
        if(e.attackTimer<=0){e.attackTimer=d.interval;e.attack=.28;toy.hp-=d.damage;toy.hit=.24;this.addImpact(toy.x,toy.y-22,'bite');
          if(toy.hp<=0){this.grid[toy.row][toy.col]=null;this.audio.play('remove');this.puff(toy.x,toy.y,'#eecb9e',14);this.events.changed?.();}
          else this.audio.play('hit');
        }
      }else{e.x-=d.speed*(e.enraged?1.75:1)*e.slowFactor*BOARD.cw*dt;e.attackTimer=Math.min(e.attackTimer,.35);}
      if(e.x<BOARD.x-29){
        if(this.trainReady[e.row]){
          this.trainReady[e.row]=false;this.trains.push({row:e.row,x:BOARD.x-83,age:0});
          this.flashBanner('O TRENZINHO SALVOU A FAIXA!',2);this.audio.play('wave');this.events.changed?.();
        }else if(!this.trains.some(t=>t.row===e.row)){
          this.state='defeat';this.audio.play('defeat');this.events.end?.('defeat',0);return;
        }
      }
    }
    for(let i=this.trains.length-1;i>=0;i--){
      const t=this.trains[i];t.age+=dt;t.x+=780*dt;
      for(const e of [...this.enemies])if(e.row===t.row&&e.x<=t.x+27&&e.x>=t.x-55)this.killEnemy(e);
      if(t.x>BOARD_RIGHT+125)this.trains.splice(i,1);
    }
    for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;if(p.life<=0)this.particles.splice(i,1);}

      for(let i=list.length-1;i>=0;i--){list[i].age+=dt;if(list[i].age>=list[i].life)list.splice(i,1);}
    }

      this.state='victory';const stars=this.trainReady.every(Boolean)?3:this.trainsLeft>=3?2:1;
      this.audio.play('victory');this.events.end?.('victory',stars);
    }
  }
  killEnemy(enemy){
    const idx=this.enemies.indexOf(enemy);if(idx<0)return;
    this.enemies.splice(idx,1);this.killCount++;this.defeated.push({type:enemy.type,x:enemy.x,y:enemy.y,age:0,life:.62});if(this.defeated.length>18)this.defeated.shift();this.puff(enemy.x,enemy.y-13,'#c4a7db',ENEMIES[enemy.type].boss?32:11);if(ENEMIES[enemy.type].boss)this.flashBanner(ENEMIES[enemy.type].bossDefeat,3);this.audio.play('enemy');
  }
}



const TAU=Math.PI*2;

const BACKDROP_CACHE=new Map();
function paintBackdrop(c,chapter){
  // Fundos estáticos são desenhados uma vez por capítulo, não a cada frame.
  if(typeof document==='undefined'){drawBackground(c,0,chapter);return;}
  let backdrop=BACKDROP_CACHE.get(chapter);
  if(!backdrop){
    backdrop=document.createElement('canvas');backdrop.width=W;backdrop.height=H;
    const ctx=backdrop.getContext('2d',{alpha:false});
    if(!ctx){drawBackground(c,0,chapter);return;}
    drawBackground(ctx,0,chapter);BACKDROP_CACHE.set(chapter,backdrop);
  }

}

function drawPlacementPreview(c,game,time){

  c.save();

      const start=x+21;c.globalAlpha=.12;c.fillStyle=toy.color||'#fff2ad';

      const reach=kind==='music'?BOARD.cw*6:kind==='clock'?BOARD.cw*toy.rangeCells:toy.splashRadius;
      const left=Math.max(BOARD.x,x-reach),right=Math.min(BOARD_RIGHT,x+reach);
      c.globalAlpha=.105;c.fillStyle=toy.color||'#fff2ad';
      for(let lane=Math.max(0,row-1);lane<=Math.min(BOARD.rows-1,row+1);lane++)
        c.fillRect(left,BOARD.y+lane*BOARD.ch+11,right-left,BOARD.ch-22);
    }
  }
  c.globalAlpha=1;

function render(c,game,menu=false,visualMotion=true){
  const t=visualMotion ? (game?.time ?? performance.now()*.001) : 0;
  c.clearRect(0,0,W,H);paintBackdrop(c,game?.level?.chapter??1);

  }
  for(let r=0;r<BOARD.rows;r++){
    const x=109;
    drawTrain(c,x,rowY(r),game?(!game.trainReady[r]&&!game.trains.some(tr=>tr.row===r)):false);
  }
  if(game){
    if(game.doorWarning && game.level.chapter===3){
      const {lane}=game.doorWarning;
      const pulse=visualMotion?(.55+.27*Math.sin(t*9)):.65;
      c.save();c.globalAlpha=pulse;
      rr(c,BOARD.x+2,BOARD.y+lane*BOARD.ch+3,BOARD.cw*BOARD.cols-4,BOARD.ch-6,12,'#ffce6f27','#ffe6a0',5);
      rr(c,1119,BOARD.y+lane*BOARD.ch+2,112,BOARD.ch-4,10,'#efbd7088','#fff1b9',5);
      c.restore();txt(c,'🚪',1173,rowY(lane),27,'#fff1c9');
      txt(c,`PORTA • FAIXA ${lane+1}`,790,BOARD.y+lane*BOARD.ch+12,14,'#fff7cd');
    }
    // Fantasma do brinquedo e indicação da sua área de ação.
    drawPlacementPreview(c,game,t);
    for(const enemy of game.enemies)drawBossIntent(c,enemy);
    const toys=game.allToys;
    for(const toy of toys)drawToy(c,toy,t,visualMotion);
    if(visualMotion)for(const toy of toys){
      if((toy.recoil||0)>.13 && TOYS[toy.type].kind!=='trap' && TOYS[toy.type].kind!=='producer'){
        const f=(toy.recoil-.13)/.09;c.save();c.globalAlpha=clamp(f,0,.8);
        star(c,toy.x+41,toy.y-15,9+5*f,4+2*f,'#fff6c5');c.restore();
      }
    }
    for(const p of game.projectiles){drawProjectileTrail(c,p,t,visualMotion);drawProjectile(c,p);}
    // Aura puramente visual dos chefes, desenhada atrás dos personagens.
    for(const e of game.enemies)if(ENEMIES[e.type]?.boss)drawBossAura(c,e,t,visualMotion);
    // Inimigos desenhados por faixa e posição; o sprite não afeta a hitbox.
    for(const e of game.enemies)drawEnemy(c,e,t,visualMotion);
    if(visualMotion)for(const d of game.defeated||[])drawDefeated(c,d);
    for(const tr of game.trains)drawTrain(c,tr.x,rowY(tr.row),false,true);
    for(const s of game.stars)drawGlow(c,s,t);
    if(visualMotion){
      for(const i of game.impacts||[])drawImpact(c,i);
      for(const p of game.particles)drawParticle(c,p,t);
      c.globalAlpha=1;
      for(const f of game.feedback||[])drawFeedback(c,f);
    }
    drawBossHealth(c,game);
    if(game.bannerUntil>game.time){rr(c,314,147,652,41,20,'#4a3265d9','#f2cf8a',3);txt(c,game.banner,640,168,22,'#fff0b9');}
    if(game.state==='playing'){
      txt(c,`${game.killCount} monstros espantados`,1062,676,15,'#fff3db','right',700);
    }
  }else{
    // Cena decorativa no menu, sem inimigos de verdade nem simulação.
    drawToy(c,{id:0,x:colX(2),y:rowY(3),hp:120,maxHp:120,type:'T02'},t);
    drawToy(c,{id:1,x:colX(3),y:rowY(2),hp:650,maxHp:650,type:'T03'},t);
    drawToy(c,{id:2,x:colX(4),y:rowY(3),hp:100,maxHp:100,type:'T01'},t);
    drawToy(c,{id:3,x:colX(5),y:rowY(4),hp:105,maxHp:105,type:'T04'},t);
    drawEnemy(c,{id:1,x:colX(7),y:rowY(2),row:2,type:'E01',age:t,hp:100,maxHp:100,hit:0},t);
    drawEnemy(c,{id:2,x:colX(8),y:rowY(3),row:3,type:'E02',age:t,hp:85,maxHp:85,hit:0},t);
  }
  // Textura discreta para dar aparência de ilustração.
  const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#fff2c00a');g.addColorStop(1,'#120b340c');c.fillStyle=g;c.fillRect(0,0,W,H);

  $('waves-text').textContent=nextWave?`Próxima em ${Math.max(0,Math.ceil(nextWave.at-battle.time))}s · ${battle.wavesLeft} ondas`:'Últimos monstros!';
  const speedButton=$('speed-btn');speedButton.setAttribute('aria-pressed',String(gameSpeed===2));speedButton.setAttribute('aria-label',`Velocidade ${gameSpeed} vezes`);speedButton.title=`Velocidade da partida: ${gameSpeed}×`;$('speed-label').textContent=`${gameSpeed}×`;
  document.querySelectorAll('[data-toy]').forEach(btn=>{const id=btn.dataset.toy;btn.classList.toggle('selected',battle.selected===id&&!battle.shovel);btn.classList.toggle('afford-no',battle.glow<TOYS[id].cost);const cd=battle.toyCooldowns[id];const layer=btn.querySelector('.cooldown');layer.classList.toggle('hidden',cd<=.01);if(cd>.01)layer.textContent=Math.ceil(cd)+'s';});
  $('shovel-btn').classList.toggle('selected',battle.shovel);
}
function handleAction(action,target){
  audio.resume();if(action!=='toggle')audio.play('click');
  if(action==='play')start(Math.min(save.unlocked-1,LEVELS.length-1));
  else if(action==='level')start(Number(target.dataset.level));
  else if(action==='levels')levels();
  else if(action==='workshop'){workshopBack=screen==='result'?'result':screen==='panel'?'levels':'menu';workshop();}
  else if(action==='workshop-back'){if(workshopBack==='result')resultScreen();else if(workshopBack==='levels')levels();else menu();}
  else if(action==='upgrade'){
    const id=target.dataset.upgrade,result=purchaseUpgrade(save,id);
    if(result.ok){const scroll=document.querySelector('.workshop-panel').scrollTop;workshop();document.querySelector('.workshop-panel').scrollTop=scroll;document.querySelector(`[data-upgrade="${id}"]`)?.focus({preventScroll:true});showToast(`${TOYS[id].short} evoluiu para o nível ${save.upgrades[id]+1}!`);}
    else showToast(result.reason==='storage'?'Não foi possível salvar. Nenhuma estrela foi gasta.':'Esta melhoria está indisponível.');
  }
  else if(action==='reset-upgrades'){if(resetUpgrades(save)){workshop();showToast('Estrelas devolvidas! Escolha novas melhorias.');}else showToast('Não foi possível salvar. Suas melhorias foram mantidas.');}
  else if(action==='menu'){if(battle&&battle.state==='paused'&&screen==='pause')confirmBefore('menu');else menu();}
  else if(action==='help')help();
  else if(action==='codex')codex();
  else if(action==='options')options();
  else if(action==='pause')pause();
  else if(action==='resume')resume();
  else if(action==='restart'&&battle){if(screen==='pause')confirmBefore('restart');else start(battle.levelIndex);}
  else if(action==='next'&&battle)start(Math.min(battle.levelIndex+1,LEVELS.length-1));
  else if(action==='cancel-confirm')pause();
  else if(action==='accept-confirm'){const kind=pendingConfirm;pendingConfirm=null;if(kind==='restart'&&battle)start(battle.levelIndex);else if(kind==='menu')menu();}
  else if(action==='shovel'&&battle){battle.selectShovel();updateHUD();}
  else if(action==='speed'&&battle&&screen==='battle'){gameSpeed=gameSpeed===1?2:1;accumulator=0;updateHUD();showToast(`Velocidade ${gameSpeed}×`,1.2);}
  else if(action==='fullscreen'){
    const frame=$('game-frame');
    if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{});}
    else if(frame.requestFullscreen){frame.requestFullscreen().then(()=>{
      window.screen.orientation?.lock?.('landscape')?.catch?.(()=>{});
    }).catch(()=>showToast('Tela cheia indisponível neste navegador',2.3));}
    else showToast('Tela cheia indisponível neste navegador',2.3);
  }
  else if(action==='toggle'){
    const id=target.dataset.setting;if(!['music','sfx','motion'].includes(id))return;save.settings[id]=!save.settings[id];audio.music=save.settings.music;audio.sfx=save.settings.sfx;if(battle){battle.effectsEnabled=motionEnabled();if(!battle.effectsEnabled){battle.particles.length=0;battle.impacts.length=0;}}persistSave(save);options(optionsBack);
  }
}
document.addEventListener('click',event=>{
  const toy=event.target.closest('[data-toy]');if(toy&&battle&&screen==='battle'){audio.resume();battle.selectToy(toy.dataset.toy);updateHUD();return;}
  const btn=event.target.closest('[data-action]');if(btn&&!btn.disabled)handleAction(btn.dataset.action,btn);
});
canvas.addEventListener('pointerdown',event=>{
  if(!battle||screen!=='battle')return;
  event.preventDefault();const r=canvas.getBoundingClientRect(),x=(event.clientX-r.left)*W/r.width,y=(event.clientY-r.top)*H/r.height;
  battle.click(x,y);updateHUD();
});
canvas.addEventListener('pointermove',event=>{
  if(!battle||screen!=='battle')return;
  const r=canvas.getBoundingClientRect(),x=(event.clientX-r.left)*W/r.width,y=(event.clientY-r.top)*H/r.height;
  const cell=rectCell(x,y);battle.hover=(cell.col>=0&&cell.col<BOARD.cols&&cell.row>=0&&cell.row<BOARD.rows)?cell:null;
});
canvas.addEventListener('pointerleave',()=>{if(battle)battle.hover=null;});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){if(screen==='battle')pause();else if(screen==='pause')resume();else if(screen==='options'&&battle)pause();else if(screen==='workshop')handleAction('workshop-back',null);else if(screen!=='menu')menu();}
  if(screen==='battle'&&battle){if(event.key.toLowerCase()==='f'){handleAction('fullscreen',null);return;}const num=Number(event.key);if(num>=1&&num<=battle.level.toys.length){battle.selectToy(battle.level.toys[num-1]);updateHUD();}}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='battle')pause();});
function loop(now){let delta=last?Math.min((now-last)/1000,.16):0;last=now;
  if(battle&&screen==='battle'&&battle.state==='playing'){
    accumulator+=delta*gameSpeed;let steps=0;const stepLimit=5*gameSpeed;
    while(accumulator>=STEP&&steps++<stepLimit&&battle.state==='playing'){
      battle.update(STEP);audio.tick(STEP);accumulator-=STEP;
    }
    if(steps>=stepLimit)accumulator=0;
    hudUpdate+=delta;if(hudUpdate>=.12){hudUpdate=0;updateHUD();}
  }else accumulator=0;
  render(context,battle,screen!=='battle'&&!battle,motionEnabled());
  requestAnimationFrame(loop);
}
menu();requestAnimationFrame(loop);
window.addEventListener('orientationchange',()=>{last=performance.now();accumulator=0;});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(new URLSearchParams(location.search).has('qa'))window.__QA__={start,battle:()=>battle,save,menu};

</script>
