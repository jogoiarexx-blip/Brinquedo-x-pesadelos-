const defaults = () => ({ version:1, unlocked:1, stars:{}, seenEnemies:[], settings:{ music:true, sfx:true, motion:true } });
function loadSave(storage=globalThis.localStorage) {
  try {
    const raw = JSON.parse(storage.getItem(SAVE_KEY));
    if (!raw || raw.version !== 1) return defaults();
    return { ...defaults(), ...raw, unlocked:Math.max(1,Math.min(LEVELS.length,Number(raw.unlocked)||1)), stars:raw.stars && typeof raw.stars==='object'&&!Array.isArray(raw.stars)?raw.stars:{}, seenEnemies:Array.isArray(raw.seenEnemies)?raw.seenEnemies:[], settings:{ ...defaults().settings, ...(raw.settings||{}) } };
  } catch { return defaults(); }
}
function persistSave(save,storage=globalThis.localStorage) {
  try { storage.setItem(SAVE_KEY,JSON.stringify(save)); return true; }
  catch { return false; }
}
function recordVictory(save,levelIndex,stars) {
  save.unlocked = Math.max(save.unlocked,Math.min(LEVELS.length,levelIndex+2));
  const id=`1-${levelIndex+1}`;
  save.stars[id]=Math.max(save.stars[id]||0,stars);
  return save;
}

class AudioService {
  constructor() { this.ctx=null; this.sfx=true; this.music=true; this.musicTimer=0; this.musicStep=0; this.lastShoot=-99; this.disabled=false; }
  resume() { if(this.disabled)return; try { const Context=window.AudioContext||window.webkitAudioContext; if(!Context)return; this.ctx ||=new Context(); if(this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); } catch {this.disabled=true;} }
  tone(freq, duration=.09, type='sine', vol=.045, at=0) {
    if (!this.ctx || this.ctx.state!=='running')return;
    const t=this.ctx.currentTime+at;
    try { const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+duration+.02); }catch{}
  }
  play(type) {
    if (!this.sfx)return;
    switch(type){
      case 'click':this.tone(560,.065,'sine',.029);break;
      case 'place':this.tone(470,.09,'triangle',.06);this.tone(730,.11,'sine',.04,.065);break;
      case 'collect':this.tone(860,.085,'sine',.055);this.tone(1175,.14,'sine',.05,.07);break;
      case 'shoot':this.tone(350,.055,'triangle',.013);break;
      case 'freeze':this.tone(720,.11,'sine',.022);this.tone(990,.12,'sine',.014,.05);break;
      case 'confetti':this.tone(440,.085,'triangle',.026);this.tone(680,.09,'triangle',.02,.04);break;
      case 'hit':this.tone(195,.085,'triangle',.028);break;
      case 'remove':this.tone(220,.14,'sine',.045);break;
      case 'no':this.tone(170,.16,'sawtooth',.03);break;
      case 'enemy':this.tone(245,.07,'triangle',.022);break;
      case 'wave':this.tone(390,.22,'square',.038);this.tone(310,.24,'square',.035,.24);break;
      case 'victory': [523,659,784,1047].forEach((f,i)=>this.tone(f,.26,'triangle',.065,i*.14));break;
      case 'defeat':[350,310,220].forEach((f,i)=>this.tone(f,.25,'triangle',.046,i*.22));break;
    }
  }
  tick(dt,playing=true) {
    if(!playing || !this.music || !this.ctx || this.ctx.state!=='running')return;
    this.musicTimer+=dt;
    if(this.musicTimer>.41){this.musicTimer%=.41;
      // Pequena melodia composta para este jogo; não reproduz trilha de terceiros.
      const notes=[392,0,523,0,587,523,440,0,392,0,349,0,330,349,392,0];
      const f=notes[this.musicStep++%notes.length]; if(f)this.tone(f,.21,'sine',.012);
    }
  }
}



class Battle {
  constructor(index=0, audio=null, events={}) {
    this.levelIndex=index;
    this.level=LEVELS[index];
    if(!this.level)throw new Error('Fase desconhecida');
    this.audio=audio || {play(){}};
    this.events=events;
    this.time=0;
    this.state='playing';
    this.glow=this.level.startingGlow;
    this.grid=Array.from({length:BOARD.rows},()=>Array(BOARD.cols).fill(null));
    this.enemies=[];this.projectiles=[];this.stars=[];this.particles=[];this.trains=[];
    this.feedback=[];this.defeated=[];this.impacts=[];
    this.trainReady=Array(BOARD.rows).fill(true);
    this.toyCooldowns=Object.fromEntries(this.level.toys.map(t=>[t,0]));
    this.selected=this.level.toys.includes('T02')?'T02':this.level.toys[0];this.hover=null;this.shovel=false;
    this.waveIndex=0;this.bigWaveAlert=false;this.totalSpawns=0;this.killCount=0;this.toysPlaced=0;
    this.lastDrop=0;this.nextDrop=5.8;this.banner='';this.bannerUntil=0;
    this.seed=0x2af00+(index+1)*1543;
    this.id=0;
    this.lastAction='';
    this.startToast(this.level.hint,6.3);
  }
  rand(){let x=this.seed|0;x^=x<<13;x^=x>>>17;x^=x<<5;this.seed=x|0;return (x>>>0)/4294967296;}
  startToast(text,seconds=2.3){this.lastAction=text;this.toastUntil=this.time+seconds;this.events.toast?.(text,seconds);}
  selectToy(id){if(!this.level.toys.includes(id))return false;this.selected=id;this.shovel=false;this.audio.play('click');return true;}
  selectShovel(){this.shovel=!this.shovel;this.audio.play('click');}
  canPlace(row,col,id=this.selected){
    if(this.state!=='playing')return 'Fase pausada';
    if(!TOYS[id])return 'Escolha um brinquedo';
    if(!Number.isInteger(row)||!Number.isInteger(col)||row<0||row>=BOARD.rows||col<0||col>=BOARD.cols)return 'Fora do tapete';
    if(this.grid[row][col])return 'Esta casa já está ocupada';
    if(!this.level.toys.includes(id))return 'Brinquedo bloqueado';
    if(this.toyCooldowns[id]>0)return 'Aguarde a recarga';
    if(this.glow<TOYS[id].cost)return 'Brilhos insuficientes';
    return null;
  }
  place(row,col,id=this.selected){
    const error=this.canPlace(row,col,id);
    if(error){this.audio.play('no');this.startToast(error,1.3);return false;}
    const data=TOYS[id];
    const toy={id:this.id++,type:id,row,col,x:colX(col),y:rowY(row),hp:data.maxHp,maxHp:data.maxHp,
      timer:data.kind==='producer'?7.5:.33+this.rand()*.6,hit:0,age:0,recoil:0};
    this.grid[row][col]=toy;this.glow-=data.cost;this.toyCooldowns[id]=data.cooldown;this.toysPlaced++;
    this.audio.play('place');this.puff(toy.x,toy.y,'#ffe2a1',9);this.addFeedback(toy.x,toy.y-68,'+ Defesa','#fff1bd');this.events.changed?.();
    return true;
  }
  remove(row,col){
    if(row<0||row>=BOARD.rows||col<0||col>=BOARD.cols)return false;
    const toy=this.grid[row][col];if(!toy)return false;
    this.grid[row][col]=null;this.puff(toy.x,toy.y,'#efdbba',12);this.audio.play('remove');this.events.changed?.();return true;
  }
  click(x,y){
    if(this.state!=='playing')return;
    for(let i=this.stars.length-1;i>=0;i--){const s=this.stars[i];
      if(Math.hypot(x-s.x,y-s.y)<38){this.glow+=s.value;this.stars.splice(i,1);this.audio.play('collect');this.puff(s.x,s.y,'#ffe46a',9);this.addFeedback(s.x,s.y-26,`+${s.value} ✦`,'#ffe878');this.events.changed?.();return 'star';}
    }
    if(x>=BOARD.x&&x<BOARD_RIGHT&&y>=BOARD.y&&y<BOARD_BOTTOM){
      const {row,col}=rectCell(x,y);
      if(this.shovel)return this.remove(row,col)?'removed':'empty';
      return this.place(row,col)?'placed':'invalid';
    }
  }
  spawnStar(x,y,fromSky=true){
    this.stars.push({id:this.id++,x,y:fromSky?BOARD.y-45:y,initialY:fromSky?BOARD.y-45:y-13,
      targetY:y,age:0,dropTime:fromSky?.9:.5,value:25});
  }
  spawnEnemy(type,lane,offset=0){
    const d=ENEMIES[type];if(!d)return;
    this.enemies.push({id:this.id++,type,row:lane,x:BOARD_RIGHT+65+offset,y:rowY(lane),hp:d.hp,maxHp:d.hp,attackTimer:.45,hit:0,age:0,slowTime:0,slowFactor:1,attack:0});
    this.totalSpawns++;
    this.events.enemySeen?.(type);
  }
  puff(x,y,color,n=6){
    for(let i=0;i<n;i++){const a=this.rand()*6.283,v=34+this.rand()*95;
      this.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,color,life:.38+this.rand()*.42,maxLife:.8,r:2+this.rand()*3});
    }
    if(this.particles.length>200)this.particles.splice(0,this.particles.length-200);
  }
  addFeedback(x,y,text,color='#fff2bb'){
    this.feedback.push({x,y,text,color,age:0,life:.88});
    if(this.feedback.length>32)this.feedback.splice(0,this.feedback.length-32);
  }
  addImpact(x,y,kind){
    this.impacts.push({x,y,kind,age:0,life:kind==='splash'?.48:.32});
    if(this.impacts.length>28)this.impacts.splice(0,this.impacts.length-28);
  }
  flashBanner(text,duration=2.8){this.banner=text;this.bannerUntil=this.time+duration;}
  get progress(){return clamp(this.time/this.level.duration,0,1);}
  get wavesLeft(){return this.level.waves.length-this.waveIndex;}
  get trainsLeft(){return this.trainReady.filter(Boolean).length;}
  get allToys(){return this.grid.flat().filter(Boolean);}
  update(dt){
    if(this.state!=='playing')return;
    this.time+=dt;
    if(!this.bigWaveAlert){const next=this.level.waves.find(w=>w.flag);
      if(next && this.time>=next.at-3){this.bigWaveAlert=true;this.flashBanner('⚑  GRANDE ONDA SE APROXIMANDO!',3.0);this.audio.play('wave');this.events.wave?.();}
    }
    while(this.waveIndex<this.level.waves.length && this.time>=this.level.waves[this.waveIndex].at){
      const w=this.level.waves[this.waveIndex++];w.enemies.forEach((e,i)=>this.spawnEnemy(e.type,e.lane,i*38));
      if(w.flag)this.flashBanner('⚑  A GRANDE ONDA CHEGOU!',2.7);
    }
    if(this.time>=this.nextDrop){
      const x=BOARD.x+48+this.rand()*(BOARD.cols*BOARD.cw-96),y=BOARD.y+36+this.rand()*(BOARD.rows*BOARD.ch-72);
      this.spawnStar(x,y,true);this.nextDrop=this.time+9+this.rand()*4;
    }
    for(const id in this.toyCooldowns)this.toyCooldowns[id]=Math.max(0,this.toyCooldowns[id]-dt);
    for(let i=this.stars.length-1;i>=0;i--){const s=this.stars[i];s.age+=dt;
      s.y=s.initialY+(s.targetY-s.initialY)*Math.min(1,s.age/s.dropTime);
      if(s.age>s.dropTime+8)this.stars.splice(i,1);
    }
    for(const toy of this.allToys){
      toy.age+=dt;toy.hit=Math.max(0,toy.hit-dt);toy.recoil=Math.max(0,(toy.recoil||0)-dt);toy.timer-=dt;
      const d=TOYS[toy.type];
      if(d.kind==='producer'&&toy.timer<=0){
        toy.timer+=d.interval;
        this.spawnStar(toy.x+21,toy.y-27,false);this.puff(toy.x,toy.y-23,'#ffee84',5);
      }
      if(['shooter','slow','splash'].includes(d.kind)&&toy.timer<=0){
        const target=this.enemies.filter(e=>e.row===toy.row&&e.hp>0&&e.x>toy.x+18&&e.x<BOARD_RIGHT+118).sort((a,b)=>a.x-b.x)[0];
        if(target){
          toy.timer+=d.interval;toy.recoil=.22;
          this.projectiles.push({id:this.id++,row:toy.row,x:toy.x+27,y:toy.y-12,damage:d.damage,kind:d.kind,slowFactor:d.slowFactor,slowDuration:d.slowDuration,splashRadius:d.splashRadius,splashRatio:d.splashRatio,age:0});
          this.audio.play(d.kind==='slow'?'freeze':d.kind==='splash'?'confetti':'shoot');
        }else{toy.timer=.12;}
      }
    }
    for(let i=this.projectiles.length-1;i>=0;i--){
      const p=this.projectiles[i],old=p.x;p.x+=dt*BOARD.cw*4.25;p.age+=dt;
      const hit=this.enemies.filter(e=>e.row===p.row&&e.hp>0&&e.x>=old-15&&e.x<=p.x+19).sort((a,b)=>a.x-b.x)[0];
      if(hit){
        // A colisão é resolvida uma única vez: lento, impacto normal ou confete com dano em área.
        const victims=p.kind==='splash'
          ? this.enemies.filter(e=>e.row===p.row&&e.hp>0&&Math.abs(e.x-hit.x)<=p.splashRadius)
          : [hit];
        for(const victim of victims){
          victim.hp-=victim===hit?p.damage:p.damage*p.splashRatio;
          victim.hit=.16;this.addImpact(victim.x,victim.y-16,p.kind);
          if(p.kind==='slow'){
            const resist=ENEMIES[victim.type].slowResistance??1;
            victim.slowFactor=Math.min(victim.slowFactor,1-(1-p.slowFactor)*resist);
            victim.slowTime=Math.max(victim.slowTime,p.slowDuration*resist);
          }
          this.puff(victim.x,victim.y-12,p.kind==='slow'?'#9beafb':p.kind==='splash'?'#ff9acc':'#ffdc8f',p.kind==='splash'?7:4);
          if(victim.hp<=0)this.killEnemy(victim);
        }
        this.projectiles.splice(i,1);
      }else if(p.x>BOARD_RIGHT+95)this.projectiles.splice(i,1);
    }
    for(let i=this.enemies.length-1;i>=0;i--){
      const e=this.enemies[i],d=ENEMIES[e.type];e.age+=dt;e.hit=Math.max(0,e.hit-dt);e.attack=Math.max(0,(e.attack||0)-dt);e.slowTime=Math.max(0,e.slowTime-dt);if(e.slowTime===0)e.slowFactor=1;
      const blockers=this.grid[e.row].filter(t=>t && e.x<=t.x+39 && e.x>=t.x-41).sort((a,b)=>b.x-a.x);
      if(blockers.length){
        const toy=blockers[0];e.attackTimer-=dt;
        if(e.attackTimer<=0){e.attackTimer=d.interval;e.attack=.28;toy.hp-=d.damage;toy.hit=.24;this.addImpact(toy.x,toy.y-22,'bite');
          if(toy.hp<=0){this.grid[toy.row][toy.col]=null;this.audio.play('remove');this.puff(toy.x,toy.y,'#eecb9e',14);this.events.changed?.();}
          else this.audio.play('hit');
        }
      }else{e.x-=d.speed*e.slowFactor*BOARD.cw*dt;e.attackTimer=Math.min(e.attackTimer,.35);}
      if(e.x<BOARD.x-29){
        if(this.trainReady[e.row]){
          this.trainReady[e.row]=false;this.trains.push({row:e.row,x:BOARD.x-83,age:0});
          this.flashBanner('O TRENZINHO SALVOU A FAIXA!',2);this.audio.play('wave');this.events.changed?.();
        }else if(!this.trains.some(t=>t.row===e.row)){
          this.state='defeat';this.audio.play('defeat');this.events.end?.('defeat',0);return;
        }
      }
    }
    for(let i=this.trains.length-1;i>=0;i--){
      const t=this.trains[i];t.age+=dt;t.x+=780*dt;
      for(const e of [...this.enemies])if(e.row===t.row&&e.x<=t.x+27&&e.x>=t.x-55)this.killEnemy(e);
      if(t.x>BOARD_RIGHT+125)this.trains.splice(i,1);
    }
    for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;if(p.life<=0)this.particles.splice(i,1);}
    for(const list of [this.feedback,this.impacts,this.defeated]){
      for(let i=list.length-1;i>=0;i--){list[i].age+=dt;if(list[i].age>=list[i].life)list.splice(i,1);}
    }
    if(this.waveIndex===this.level.waves.length && this.enemies.length===0 && this.trains.length===0){
      this.state='victory';const stars=this.trainReady.every(Boolean)?3:this.trainsLeft>=3?2:1;
      this.audio.play('victory');this.events.end?.('victory',stars);
    }
  }
  killEnemy(enemy){
    const idx=this.enemies.indexOf(enemy);if(idx<0)return;
    this.enemies.splice(idx,1);this.killCount++;this.defeated.push({type:enemy.type,x:enemy.x,y:enemy.y,age:0,life:.62});if(this.defeated.length>18)this.defeated.shift();this.puff(enemy.x,enemy.y-13,'#c4a7db',ENEMIES[enemy.type].boss?32:11);if(ENEMIES[enemy.type].boss)this.flashBanner('O REI DAS MEIAS FOI DERROTADO!',3);this.audio.play('enemy');
  }

const TAU=Math.PI*2;

function ellipse(c,x,y,rx,ry,color){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fillStyle=color;c.fill();}
function rr(c,x,y,w,h,r,fill,stroke=null,lw=2){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke();}}
function line(c,pts,color,width=2){c.beginPath();c.moveTo(...pts[0]);for(const p of pts.slice(1))c.lineTo(...p);c.strokeStyle=color;c.lineWidth=width;c.lineJoin='round';c.lineCap='round';c.stroke();}

function drawImpact(c,i){
  const k=clamp(i.age/i.life,0,1);c.save();c.globalAlpha=(1-k)*.8;
  const r=(i.kind==='splash'?12:6)+(i.kind==='splash'?50:25)*k;
  c.lineWidth=i.kind==='slow'?4:3;c.strokeStyle=i.kind==='slow'?'#c9f9ff':i.kind==='bite'?'#ffe3af':i.kind==='splash'?'#ffe3b3':'#fff4d6';
  c.beginPath();c.arc(i.x,i.y,r,0,TAU);c.stroke();
  if(i.kind==='splash'){for(let a=0;a<7;a++){const theta=a*TAU/7+k;star(c,i.x+Math.cos(theta)*(r+6),i.y+Math.sin(theta)*(r+6),5,2,['#f7a1ca','#fff09d','#9ce9d9'][a%3]);}}
  if(i.kind==='slow')for(let a=0;a<4;a++){const theta=a*TAU/4;star(c,i.x+Math.cos(theta)*(r+6),i.y+Math.sin(theta)*(r+6),7,3,'#e3fcff');}
  c.restore();
}

  txt(c,'👑 Rei das Meias',493,658,15,'#ffdeab','left');
  rr(c,590,652,257,19,9,'#241a32','#b88da9',2);
  rr(c,594,655,249*ratio,13,6,ratio>.35?'#f795af':'#ffe18d');
}
function render(c,game,menu=false,visualMotion=true){
  const t=visualMotion ? (game?.time ?? performance.now()*.001) : 0;
  c.clearRect(0,0,W,H);drawBackground(c,t);
  if(game?.levelIndex>=4){
    // Capítulo mais avançado ganha um leve clima de armário encantado, sem outra textura ou download.
    c.fillStyle=game.levelIndex===7?'#50204e19':'#34246b0b';c.fillRect(0,0,W,H);
  }
  for(let r=0;r<BOARD.rows;r++){
    const x=109;
    drawTrain(c,x,rowY(r),game?(!game.trainReady[r]&&!game.trains.some(tr=>tr.row===r)):false);
  }
  if(game){
    // Pré-visualização suave da casa selecionada.
    if(game.hover && game.state==='playing'){
      const {col,row}=game.hover;
      if(row>=0&&row<BOARD.rows&&col>=0&&col<BOARD.cols){const ok=game.shovel?!!game.grid[row][col]:!game.canPlace(row,col);
        rr(c,BOARD.x+col*BOARD.cw+4,BOARD.y+row*BOARD.ch+4,BOARD.cw-8,BOARD.ch-8,12,ok?'#f5eeb04c':'#f77f8e44',ok?'#ffdf7b':'#f47d88',3);
      }
    }
    for(const toy of game.allToys)drawToy(c,toy,t,visualMotion);
    for(const p of game.projectiles)drawProjectile(c,p);
    // Inimigos desenhados por faixa e posição; o sprite não afeta a hitbox.
    for(const e of game.enemies)drawEnemy(c,e,t,visualMotion);
    if(visualMotion)for(const d of game.defeated||[])drawDefeated(c,d);
    for(const tr of game.trains)drawTrain(c,tr.x,rowY(tr.row),false,true);
    for(const s of game.stars)drawGlow(c,s,t);
    if(visualMotion){
      for(const i of game.impacts||[])drawImpact(c,i);
      for(const p of game.particles){c.globalAlpha=clamp(p.life/p.maxLife,0,1);ellipse(c,p.x,p.y,p.r,p.r,p.color);}
      c.globalAlpha=1;
      for(const f of game.feedback||[])drawFeedback(c,f);
    }
    drawBossHealth(c,game);
    if(game.bannerUntil>game.time){rr(c,314,147,652,41,20,'#4a3265d9','#f2cf8a',3);txt(c,game.banner,640,168,22,'#fff0b9');}
    if(game.state==='playing'){
      txt(c,`${game.killCount} monstros espantados`,1062,676,15,'#fff3db','right',700);
    }
  }else{
    // Cena decorativa no menu, sem inimigos de verdade nem simulação.
    drawToy(c,{id:0,x:colX(2),y:rowY(3),hp:120,maxHp:120,type:'T02'},t);
    drawToy(c,{id:1,x:colX(3),y:rowY(2),hp:650,maxHp:650,type:'T03'},t);
    drawToy(c,{id:2,x:colX(4),y:rowY(3),hp:100,maxHp:100,type:'T01'},t);
    drawToy(c,{id:3,x:colX(5),y:rowY(4),hp:105,maxHp:105,type:'T04'},t);
    drawEnemy(c,{id:1,x:colX(7),y:rowY(2),row:2,type:'E01',age:t,hp:100,maxHp:100,hit:0},t);
    drawEnemy(c,{id:2,x:colX(8),y:rowY(3),row:3,type:'E02',age:t,hp:85,maxHp:85,hit:0},t);
  }
  // Textura discreta para dar aparência de ilustração.
  const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#fff2c00a');g.addColorStop(1,'#120b340c');c.fillStyle=g;c.fillRect(0,0,W,H);
}
function drawIconCanvas(c,id,x,y,scale=.65,time=0){
  const d=TOYS[id];if(!d)return;
  drawToy(c,{id:0,type:id,x,y,hp:d.maxHp,maxHp:d.maxHp,hit:0},time);
}







const $=id=>document.getElementById(id);
const canvas=$('battle-canvas'),context=canvas.getContext('2d',{alpha:false});
const audio=new AudioService();const save=loadSave();audio.music=save.settings.music;audio.sfx=save.settings.sfx;
let battle=null,screen='menu',last=0,accumulator=0,hudUpdate=0,toastTimer=null,optionsBack='menu',lastResult=null,pendingConfirm=null;
const icons={T01:'💡',T02:'🪖',T03:'🧸',T04:'❄️',T05:'🎉',E01:'☁️',E02:'🧦',E03:'🛏️',E04:'✏️',E05:'👑'};
const escapeHTML=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showToast(text,seconds=2.8){let toast=$('toast');toast.textContent=text;toast.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.add('hidden'),seconds*1000);}
function setScreen(name,content=''){screen=name;const layer=$('screen');if(name==='battle'){layer.classList.add('hidden');$('hud').classList.remove('hidden');return;}
  layer.classList.remove('hidden');layer.innerHTML=content; $('hud').classList.toggle('hidden',name==='menu'||name==='levels'||name==='help'||name==='codex'||name==='credits'||(name==='options'&&!battle));
  layer.classList.toggle('no-backdrop',false);
}
function button(text,action,kind='big-btn',additional=''){return `<button class="${kind}" data-action="${action}" ${additional}>${text}</button>`;}
function panel(title,kicker,content,back='menu',extra=''){setScreen(extra||'panel',`<section class="panel" aria-label="${escapeHTML(title)}"><div class="panel-head"><div><span class="subheading">${kicker}</span><h1>${title}</h1></div>${button('✕ Voltar',back,'tiny-btn')}</div>${content}</section>`);}
function menu(){battle=null;
  setScreen('menu',`<div class="menu-content"><div class="menu-hero"><span class="kicker">✦ Uma aventura no quarto da Lia</span><h1 class="logo">BRINQUEDOS <span class="vs">VS.</span><br><em>PESADELOS!</em></h1><p class="menu-description">Quando o armário se abre... o quarto revida! Monte sua defesa e espante monstros muito atrapalhados.</p><div class="menu-note">✦ 8 fases jogáveis &nbsp; ✦ 5 faixas &nbsp; ✦ Salva automaticamente</div></div><nav class="menu-actions" aria-label="Menu principal">${button(save.unlocked>1?'▶ CONTINUAR':'▶ JOGAR','play')}${button('🗺 ESCOLHER FASE','levels','outline-btn')}${button('📖 BRINQUEDOPÉDIA','codex','outline-btn')}${button('❔ COMO JOGAR','help','text-btn')}${button('⚙ OPÇÕES','options','text-btn')}${button('⛶ TELA CHEIA','fullscreen','text-btn')}</nav></div>`);
}
function levels(){
  const cards=LEVELS.map((lvl,i)=>{const unlocked=i<save.unlocked;
    return `<button class="level-choice" data-action="level" data-level="${i}" ${unlocked?'':'disabled'}><strong>${unlocked?'✦':'🔒'} ${lvl.id}</strong><span>${escapeHTML(lvl.title)}</span><small>${unlocked?'⭐'.repeat(save.stars[lvl.id]||0)||'Jogar agora':'Conclua a anterior'}</small></button>`;}).join('');
  panel('O Quarto Acordou','Capítulo 1 · selecione sua fase',`<p>Comece pelo início ou rejogue uma fase já liberada.</p><div class="levels">${cards}</div><p>O capítulo 1 tem oito fases. Complete a 1-8 para enfrentar o Rei das Meias; os próximos capítulos chegarão depois.</p>`);
}
function help(back=battle?'pause':'menu'){
  panel('Como jogar','Seu Pião explica',`<p>Você precisa impedir que os pesadelos cheguem ao baú da imaginação.</p><div class="guide"><div class="guide-item"><strong>1. Escolha um brinquedo</strong><br>Toque em uma carta na faixa superior.</div><div class="guide-item"><strong>2. Defenda uma casa</strong><br>Toque em um quadradinho vazio do tapete.</div><div class="guide-item"><strong>3. Colete ✦ Brilhos</strong><br>Toque nas estrelinhas douradas; cada uma vale 25.</div><div class="guide-item"><strong>4. Proteja as 5 faixas</strong><br>Um trenzinho salva cada faixa apenas uma vez.</div><div class="guide-item"><strong>5. Economize</strong><br>Abajures criam Brilhos; soldados atacam; ursos bloqueiam; piões congelam; confetes acertam grupos.</div><div class="guide-item"><strong>6. Vitória!</strong><br>Espante todos os monstros, inclusive a grande onda.</div></div><p>Atalhos no PC: teclas <strong>1 a 5</strong> selecionam cartas, <strong>F</strong> ativa tela cheia e <strong>Esc</strong> abre a pausa. No celular, prefira a orientação horizontal e toque em <strong>⛶ Tela</strong> para ampliar.</p>`,back,'help');
}
function codex(){
  const toys=Object.values(TOYS).map(t=>`<div class="catalog-entry"><div class="emoji">${icons[t.id]}</div><div><strong>${t.name}</strong><small>✦ ${t.cost} · ${t.description}</small></div></div>`).join('');
  const enemies=Object.values(ENEMIES).map(e=>`<div class="catalog-entry"><div class="emoji">${icons[e.id]}</div><div><strong>${e.name}</strong><small>${e.description}</small></div></div>`).join('');
  panel('Brinquedopédia','Conheça os moradores',`<p>Conheça os brinquedos e os pesadelos do Capítulo 1.</p><div class="catalog">${toys}${enemies}</div>`,'menu','codex');
}
function options(back=battle?'pause':'menu'){
  optionsBack=back;
  const setting=(name,text)=>`<div class="option-row"><span>${text}</span><button class="toggle ${save.settings[name]?'':'off'}" data-action="toggle" data-setting="${name}">${save.settings[name]?'Ligado':'Desligado'}</button></div>`;
  panel('Opções','Ajuste a experiência',`${setting('music','🎵 Música original suave')}${setting('sfx','🔊 Efeitos sonoros')}${setting('motion','✨ Partículas e efeitos visuais')}<p>O progresso é salvo automaticamente no seu navegador. Este protótipo funciona sem conta.</p>`,back,'options');
}
function pause(){if(!battle||battle.state==='victory'||battle.state==='defeat')return;
  battle.state='paused';setScreen('pause',`<section class="panel result-panel" style="max-width:620px"><span class="subheading">Brinquedos descansando...</span><h1>⏸ Jogo pausado</h1><p>${battle.level.id} · ${battle.level.title}</p><div class="panel-actions">${button('▶ Continuar','resume')}${button('↻ Reiniciar fase','restart','outline-btn')}${button('⚙ Opções','options','text-btn')}${button('❔ Como jogar','help','text-btn')}${button('⌂ Menu principal','menu','text-btn')}</div></section>`);
}
function confirmBefore(kind){
  pendingConfirm=kind;
  setScreen('confirm',`<section class="panel result-panel" style="max-width:610px"><span class="subheading">Cuidado com os brinquedos!</span><h1>Você tem certeza?</h1><p>${kind==='restart'?'Reiniciar vai apagar a defesa construída nesta tentativa.':'Sair agora vai encerrar a fase atual. As fases concluídas continuam salvas.'}</p><div class="panel-actions">${button('Não, voltar','cancel-confirm','outline-btn')}${button('Sim, continuar','accept-confirm','text-btn')}</div></section>`);
}
function resume(){if(!battle)return;battle.state='playing';setScreen('battle');last=performance.now();accumulator=0;}
function start(index){if(index>=save.unlocked)return;
  battle=new Battle(index,audio,{toast:showToast,changed:()=>updateHUD(),end:finish,enemySeen:type=>{if(!save.seenEnemies.includes(type)){save.seenEnemies.push(type);persistSave(save);}}});
  audio.resume();renderCards();setScreen('battle');$('level-label').textContent=`Fase ${battle.level.id}`;$('phase-name').textContent=battle.level.title;
  last=performance.now();accumulator=0;hudUpdate=0;updateHUD();
}
function finish(result,stars){if(!battle)return;
  lastResult=result;if(result==='victory'){recordVictory(save,battle.levelIndex,stars);persistSave(save);}
  const isLast=battle.levelIndex>=LEVELS.length-1;
  const unlock=battle.level.reward?`<div class="result-unlock">🎁 Novo brinquedo para a próxima fase: <strong>${TOYS[battle.level.reward].name}</strong>!</div>`:'';
  setScreen('result',`<section class="panel result-panel"><span class="subheading">${result==='victory'?'A noite está a salvo!':'Os pesadelos bagunçaram tudo!'}</span><h1>${result==='victory'?'🎉 Vitória!':'😵 Tente de novo!'}</h1><div class="result-score ${result==='victory'?'win-animation':'lose-animation'}">${result==='victory'?'⭐'.repeat(stars)+'☆'.repeat(3-stars):'☁️'}</div><p>${result==='victory'?'Você espantou '+battle.killCount+' monstros e protegeu a imaginação da Lia.':'Sua defesa não segurou a invasão. Experimente colocar soldados em mais faixas.'}</p>${result==='victory'?unlock:''}<div class="panel-actions">${result==='victory'&&!isLast?button('▶ Próxima fase','next'):''}${button('↻ '+(result==='victory'?'Jogar novamente':'Tentar de novo'),'restart','outline-btn')}${button('🗺 Escolher fase','levels','text-btn')}${button('⌂ Menu','menu','text-btn')}</div>${isLast&&result==='victory'?'<p>Você completou todas as fases jogáveis desta primeira versão! ✨</p>':''}</section>`);
}
function renderCards(){if(!battle)return;const el=$('toy-cards');el.innerHTML=battle.level.toys.map((id,i)=>{const d=TOYS[id];return `<button class="toy-card ${battle.selected===id?'selected':''}" data-toy="${id}" title="${d.name}: ${d.description}" aria-label="${d.name}, custa ${d.cost} Brilhos"><span class="toy-card-icon">${icons[id]}</span><span class="toy-card-name">${d.short}</span><span class="cost">✦ ${d.cost}</span><span class="cooldown hidden"></span></button>`;}).join('');}
function updateHUD(){if(!battle)return;$('glow-count').textContent=Math.floor(battle.glow);
  $('wave-progress').style.width=`${Math.round(battle.progress*100)}%`;
  $('waves-text').textContent=battle.wavesLeft?`${battle.wavesLeft} ondas pela frente`:'Últimos monstros!';
  document.querySelectorAll('[data-toy]').forEach(btn=>{const id=btn.dataset.toy;btn.classList.toggle('selected',battle.selected===id&&!battle.shovel);btn.classList.toggle('afford-no',battle.glow<TOYS[id].cost);const cd=battle.toyCooldowns[id];const layer=btn.querySelector('.cooldown');layer.classList.toggle('hidden',cd<=.01);if(cd>.01)layer.textContent=Math.ceil(cd)+'s';});
  $('shovel-btn').classList.toggle('selected',battle.shovel);
}
function handleAction(action,target){
  audio.resume();if(action!=='toggle')audio.play('click');
  if(action==='play')start(Math.min(save.unlocked-1,LEVELS.length-1));
  else if(action==='level')start(Number(target.dataset.level));
  else if(action==='levels')levels();
  else if(action==='menu'){if(battle&&battle.state==='paused'&&screen==='pause')confirmBefore('menu');else menu();}
  else if(action==='help')help();
  else if(action==='codex')codex();
  else if(action==='options')options();
  else if(action==='pause')pause();
  else if(action==='resume')resume();
  else if(action==='restart'&&battle){if(screen==='pause')confirmBefore('restart');else start(battle.levelIndex);}
  else if(action==='next'&&battle)start(Math.min(battle.levelIndex+1,LEVELS.length-1));
  else if(action==='cancel-confirm')pause();
  else if(action==='accept-confirm'){const kind=pendingConfirm;pendingConfirm=null;if(kind==='restart'&&battle)start(battle.levelIndex);else if(kind==='menu')menu();}
  else if(action==='shovel'&&battle){battle.selectShovel();updateHUD();}
  else if(action==='fullscreen'){
    const frame=$('game-frame');
    if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{});}
    else if(frame.requestFullscreen){frame.requestFullscreen().then(()=>{
      window.screen.orientation?.lock?.('landscape')?.catch?.(()=>{});
    }).catch(()=>showToast('Tela cheia indisponível neste navegador',2.3));}
    else showToast('Tela cheia indisponível neste navegador',2.3);
  }
  else if(action==='toggle'){
    const id=target.dataset.setting;save.settings[id]=!save.settings[id];audio.music=save.settings.music;audio.sfx=save.settings.sfx;persistSave(save);options(optionsBack);
  }
}
document.addEventListener('click',event=>{
  const toy=event.target.closest('[data-toy]');if(toy&&battle&&screen==='battle'){audio.resume();battle.selectToy(toy.dataset.toy);updateHUD();return;}
  const btn=event.target.closest('[data-action]');if(btn&&!btn.disabled)handleAction(btn.dataset.action,btn);
});
canvas.addEventListener('pointerdown',event=>{
  if(!battle||screen!=='battle')return;
  event.preventDefault();const r=canvas.getBoundingClientRect(),x=(event.clientX-r.left)*W/r.width,y=(event.clientY-r.top)*H/r.height;
  battle.click(x,y);updateHUD();
});
canvas.addEventListener('pointermove',event=>{
  if(!battle)return;
  const r=canvas.getBoundingClientRect(),x=(event.clientX-r.left)*W/r.width,y=(event.clientY-r.top)*H/r.height;
  const cell=rectCell(x,y);battle.hover=(cell.col>=0&&cell.col<BOARD.cols&&cell.row>=0&&cell.row<BOARD.rows)?cell:null;
});
canvas.addEventListener('pointerleave',()=>{if(battle)battle.hover=null;});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){if(screen==='battle')pause();else if(screen==='pause')resume();else if(screen==='options'&&battle)pause();else if(screen!=='menu')menu();}
  if(screen==='battle'&&battle){if(event.key.toLowerCase()==='f'){handleAction('fullscreen',null);return;}const num=Number(event.key);if(num>=1&&num<=battle.level.toys.length){battle.selectToy(battle.level.toys[num-1]);updateHUD();}}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='battle')pause();});
function loop(now){let delta=last?Math.min((now-last)/1000,.16):0;last=now;
  if(battle&&screen==='battle'&&battle.state==='playing'){
    accumulator+=delta;let steps=0;
    while(accumulator>=STEP&&steps++<5&&battle.state==='playing'){
      battle.update(STEP);audio.tick(STEP);accumulator-=STEP;
    }
    if(steps>=5)accumulator=0;
    hudUpdate+=delta;if(hudUpdate>=.12){hudUpdate=0;updateHUD();}
  }else accumulator=0;
  render(context,battle,screen!=='battle'&&!battle,save.settings.motion);
  requestAnimationFrame(loop);
}
menu();requestAnimationFrame(loop);
window.addEventListener('orientationchange',()=>{last=performance.now();accumulator=0;});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(new URLSearchParams(location.search).has('qa'))window.__QA__={start,battle:()=>battle,save,menu};

</script>
