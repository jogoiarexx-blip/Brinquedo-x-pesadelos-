name: Browser 2D / 3D cinematic QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser QA tools
        run: npm install --no-save --package-lock=false playwright@1.56.1 three@0.170.0
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real browser cinematic and mobile checks
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/bvp-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/browser_cinematic_qa.mjs
      - name: Upload screenshots, metrics and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-v2-3
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 14
