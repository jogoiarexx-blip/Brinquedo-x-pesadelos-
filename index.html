<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#392949" />
  <meta name="description" content="Brinquedos vs. Pesadelos: defenda o quarto da Lia em um jogo de estratégia 2D!" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="stylesheet" href="./src/style.css" />
  <title>Brinquedos vs. Pesadelos — v0.4.0</title>
</head>
<body>
  <main class="app" aria-label="Jogo Brinquedos vs. Pesadelos">
    <div class="game-frame" id="game-frame">
      <canvas id="battle-canvas" width="1280" height="720" aria-label="Tabuleiro do jogo com cinco faixas e nove colunas"></canvas>
      <div id="hud" class="hud hidden">
        <div class="topbar">
          <div class="glow-pill" aria-live="polite"><span class="glow-symbol">✦</span><span id="glow-count">150</span><small>Brilhos</small></div>
          <div id="toy-cards" class="toy-cards" role="toolbar" aria-label="Brinquedos disponíveis"></div>
          <button id="shovel-btn" class="small-btn shovel-btn" data-action="shovel" title="Guardar brinquedo">🧹 <small>Guardar</small></button>
          <button class="small-btn fullscreen-btn" data-action="fullscreen" title="Ampliar o jogo" aria-label="Tela cheia">⛶ <small>Tela</small></button>
          <button class="small-btn pause-btn" data-action="pause" title="Pausar o jogo">Ⅱ <small>Pausa</small></button>
        </div>
        <div class="level-row"><div class="level-label"><span id="level-label">Fase 1-1</span><span id="phase-name">A primeira bagunça</span></div>
          <div class="waves-area"><span id="waves-text">Invasão começando...</span><div class="progress-track"><div id="wave-progress" class="progress-fill"></div></div></div>
        </div>
      </div>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
      <div id="screen" class="screen"></div>
      <div class="version-tag">ALFA 0.4.0 · 2 capítulos</div>
    </div>
    <div class="mobile-tip" aria-label="Orientação recomendada">↻ Vire o celular na horizontal para ver todo o tabuleiro.</div>
    <footer class="outside-footer">Brinquedos vs. Pesadelos · Um jogo original de defesa por linhas · Salvo neste dispositivo</footer>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
